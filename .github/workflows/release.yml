# Builds the installers and attaches them to a GitHub Release.
# Start it by pushing a tag that begins with "v", for example:
#   git tag v1.0.0 && git push origin v1.0.0
# The file names are the ones website/config.js expects.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Signing is optional. Without a certificate the macOS app is signed ad hoc and Windows is unsigned,
      # and both systems warn the person installing. See RELEASING.md for what to store once you have them.
      # An empty secret must not reach electron-builder: it reads "" as a path and fails with "not a file".
      - name: Build installers
        shell: bash
        run: |
          if [ -n "$SIGN_CSC_LINK" ]; then export CSC_LINK="$SIGN_CSC_LINK" CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ -n "$SIGN_APPLE_ID" ]; then export APPLE_ID="$SIGN_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_PASSWORD" APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"; fi
          npm run ${{ matrix.script }}
        env:
          SIGN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run server:build
      - run: cp dist-server/server.js superdevops-service.js
      - uses: actions/upload-artifact@v4
        with:
          name: service
          path: superdevops-service.js

  publish:
    needs: [installers, service]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
